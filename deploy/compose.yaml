# open-bot local dependencies — single entry (Compose Spec)
#
# Usage (from repo root):
#   make compose-up                          # core: postgres / redis / minio / markitdown
#   make compose-casdoor                     # + profile casdoor
#   make compose-langfuse                    # + profile langfuse (needs deploy/langfuse/.env)
#   make compose-down                        # tear down all profiles for this project
#
# Or directly:
#   docker compose -f deploy/compose.yaml --project-directory deploy up -d
#   docker compose -f deploy/compose.yaml --project-directory deploy --profile casdoor up -d
#   docker compose -f deploy/compose.yaml --project-directory deploy --profile langfuse --env-file deploy/langfuse/.env up -d
#
# See deploy/README.md for ports, profiles, and volume migration notes.

include:
  - path: compose/core.yaml
  - path: compose/casdoor.yaml
  - path: compose/langfuse.yaml
  - path: compose/app.yaml
