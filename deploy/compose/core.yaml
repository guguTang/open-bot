# Core open-bot dependencies (always on — no profile)
services:
  postgres:
    # pgvector image (dev: recreate volume if upgrading from plain postgres)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
      POSTGRES_DB: openbot
    ports:
      - "5432:5432"
    volumes:
      - openbot_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openbot
      MINIO_ROOT_PASSWORD: openbotopenbot
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - openbot_minio:/data

  # PDF/DOCX/XLSX/XLS/PPTX → Markdown. Release CI also pushes this Dockerfile
  # to ghcr.io/<owner>/openbot-markitdown (see docs/release.md). API is not in this stack:
  #   make dev-api uses the published port (DOC_PARSE_URL=http://127.0.0.1:8010).
  #   An API container on this network would use http://markitdown:8010.
  # Host port 8010 avoids the agent runtime on :8001.
  markitdown:
    build:
      context: ../../services/markitdown
      dockerfile: Dockerfile
    image: openbot-markitdown:dev
    environment:
      CONVERT_TIMEOUT_SECONDS: "60"
      MAX_UPLOAD_BYTES: "20971520"
    ports:
      # Local API (`make dev-api`) is on the host, not this network.
      - "127.0.0.1:8010:8010"

volumes:
  openbot_pg:
  openbot_minio:
