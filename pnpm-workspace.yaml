packages:
  - "apps/*"
  - "e2e"

# pnpm 10 默认拦截依赖的 postinstall。esbuild / unrs-resolver 是 Metro 与 Expo CLI 的依赖。
# heroui-native-pro 仍留给 apps/mobile-rn 的可选 Pro 包（web 已不再使用 @heroui-pro/react）。
# Android 上 react-native-webview 的 injectedObjectJson 晚于页面脚本，
# DOM 入口会在 $$EXPO_DOM_HOST_OS 写入前就执行。这个补丁让引导脚本等到值就绪再加载 bundle。
patchedDependencies:
  "@expo/cli@57.0.29": patches/@expo__cli@57.0.29.patch

onlyBuiltDependencies:
  - esbuild
  - heroui-native-pro
  - node-pty
  - unrs-resolver

allowBuilds:
  heroui-native-pro: true
