packages:
  - "apps/*"
  - "e2e"

# pnpm 10 默认拦截依赖的 postinstall。HeroUI Pro 的产物就是靠 postinstall
# 从 CDN 拉取的，必须放行；esbuild / unrs-resolver 是 Metro 与 Expo CLI 的依赖。
# Android 上 react-native-webview 的 injectedObjectJson 晚于页面脚本，
# DOM 入口会在 $$EXPO_DOM_HOST_OS 写入前就执行。这个补丁让引导脚本等到值就绪再加载 bundle。
patchedDependencies:
  "@expo/cli@57.0.29": patches/@expo__cli@57.0.29.patch

onlyBuiltDependencies:
  - esbuild
  - heroui-native-pro
  - heroui-pro
  - node-pty
  - unrs-resolver

allowBuilds:
  '@heroui-pro/react': true
  heroui-native-pro: true
  heroui-pro: true
